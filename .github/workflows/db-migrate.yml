name: Apply Supabase migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema to production
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: hrsblcjekgtncappdexx
        run: |
          set -e
          try_host () {
            echo "trying $1 (user $2)…"
            if psql "host=$1 port=5432 user=$2 dbname=postgres sslmode=require connect_timeout=12" \
                 -v ON_ERROR_STOP=1 -f supabase/migrations/0001_init.sql; then
              echo "APPLIED via $1"; return 0
            fi
            return 1
          }
          try_host "db.$PROJECT_REF.supabase.co" "postgres" && exit 0
          for n in 0 1; do
            for region in ca-central-1 us-east-1 us-east-2 us-west-1 us-west-2 eu-west-1 eu-central-1 ap-southeast-1 ap-southeast-2 sa-east-1; do
              try_host "aws-$n-$region.pooler.supabase.com" "postgres.$PROJECT_REF" && exit 0
            done
          done
          echo "All connection attempts failed" >&2
          exit 1
      - name: Verify tables exist
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: echo "verification happens via REST API from the orchestrator"
